<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PartsPilot Planner</title>
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="hero">
        <h1>PartsPilot</h1>
        <p>
          AI planning for dealership parts: reduce obsolescence, control inventory,
          protect fill-rate.
        </p>
      </section>

      <section class="panel controls">
        <div class="controls-top">
          <button id="load-demo">Load Demo Data</button>
          <button id="run-plan" class="primary">Run Plan</button>
          <button id="download-template">Download CSV Template</button>
          <button id="export-plan">Export Plan CSV</button>
        </div>

        <div class="import-row">
          <label class="file-label">
            Import CSV
            <input id="csv-file" type="file" accept=".csv,text/csv" />
          </label>
          <button id="import-csv">Import CSV</button>
        </div>

        <div class="grid">
          <label>
            Target Inventory Reduction (%)
            <input id="target-reduction" type="number" value="15" min="0" max="100" />
          </label>
          <label>
            Minimum Fill Rate (%)
            <input id="min-fill-rate" type="number" value="94" min="0" max="100" />
          </label>
          <label>
            Review Period (Days)
            <input id="review-days" type="number" value="14" min="1" />
          </label>
        </div>

        <label>
          Parts JSON
          <textarea id="parts-json" rows="14"></textarea>
        </label>
      </section>

      <section class="panel kpis">
        <h2>Plan KPIs</h2>
        <div id="kpi-grid" class="kpi-grid"></div>
      </section>

      <section class="panel">
        <h2>Recommendations</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Part</th>
                <th>Action</th>
                <th>Obsolete Risk</th>
                <th>Stockout Risk</th>
                <th>Current Turns</th>
                <th>Projected Turns</th>
                <th>Order Qty</th>
                <th>Value Impact</th>
                <th>Rationale</th>
              </tr>
            </thead>
            <tbody id="recommendation-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/web/app.js" defer></script>
  </body>
  </html>
